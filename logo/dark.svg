<svg xmlns="http://www.w3.org/2000/svg" width="244" height="44" viewBox="0 0 244 44" fill="none" role="img" aria-labelledby="title"><title id="title">Lumos Developers</title>
<g transform="translate(0 2) scale(.333333)" color="#7396EC">
  <!-- Círculo central -->
  <circle cx="60" cy="60" r="11" fill="currentColor"/>

  <!-- Nodos cardinales (grandes) -->
  <circle cx="60" cy="21" r="11" fill="currentColor"/>
  <circle cx="60" cy="99" r="11" fill="currentColor"/>
  <circle cx="21" cy="60" r="11" fill="currentColor"/>
  <circle cx="99" cy="60" r="11" fill="currentColor"/>

  <!-- Conectores cardinales -->
  <g stroke="currentColor" stroke-width="6" stroke-linecap="round">
    <line x1="60" y1="32" x2="60" y2="44"/>
    <line x1="60" y1="88" x2="60" y2="76"/>
    <line x1="32" y1="60" x2="44" y2="60"/>
    <line x1="88" y1="60" x2="76" y2="60"/>
  </g>

  <!-- Nodos diagonales (pequeños) -->
  <circle cx="33" cy="33" r="7" fill="currentColor"/>
  <circle cx="87" cy="33" r="7" fill="currentColor"/>
  <circle cx="33" cy="87" r="7" fill="currentColor"/>
  <circle cx="87" cy="87" r="7" fill="currentColor"/>

  <!-- Conectores diagonales (cortos) -->
  <g stroke="currentColor" stroke-width="6" stroke-linecap="round">
    <line x1="38.5" y1="38.5" x2="47.5" y2="47.5"/>
    <line x1="81.5" y1="38.5" x2="72.5" y2="47.5"/>
    <line x1="38.5" y1="81.5" x2="47.5" y2="72.5"/>
    <line x1="81.5" y1="81.5" x2="72.5" y2="72.5"/>
  </g>
</g>
<text x="50" y="28" fill="#EFF1F5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="26" letter-spacing="-1">lumos</text>
<path d="M143 11v23" stroke="#EFF1F5" stroke-opacity=".2"/>
<text x="155" y="26" fill="#EFF1F5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="500" font-size="12">developers</text>
</svg>
